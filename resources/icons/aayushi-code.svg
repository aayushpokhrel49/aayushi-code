<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#121218"/>
      <stop offset="100%" style="stop-color:#1a1a24"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6464ff"/>
      <stop offset="100%" style="stop-color:#8a8aff"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="64" fill="url(#bg-gradient)"/>
  
  <!-- Inner border -->
  <rect x="48" y="48" width="416" height="416" rx="48" fill="none" stroke="#6464ff" stroke-width="4"/>
  
  <!-- Code brackets symbol -->
  <g fill="none" stroke="url(#accent-gradient)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket -->
    <path d="M160 176 L96 256 L160 336"/>
    <!-- Right bracket -->
    <path d="M352 176 L416 256 L352 336"/>
  </g>
  
  <!-- Middle slash -->
  <line x1="220" y1="352" x2="292" y2="160" stroke="#ff79c6" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Small dots representing editor features -->
  <circle cx="120" cy="400" r="12" fill="#50fa7b"/>
  <circle cx="160" cy="400" r="12" fill="#f1fa8c"/>
  <circle cx="200" cy="400" r="12" fill="#ff79c6"/>
</svg>
